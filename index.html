<head>

  <title>ARENA TRIPLE — Pulse · Kart · Fight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <main class="hub">
    <p class="eyebrow">PROMPT CONTEST PACK</p>
    <h1>ARENA<br /><span>TRIPLE</span></h1>
    <p class="lead">Drei Browser-Spiele. Ein Link. Kein Server-Stress.</p>

    <div class="grid">
      <a class="card pulse" href="pulse/">
        <span class="mode">01</span>
        <h2>AETHER PULSE</h2>
        <p>Neon-Arena-Shooter. Wellen, Combos, Pulse-Slowmo.</p>
        <span class="go">PLAY</span>
      </a>
      <a class="card kart" href="kart/">
        <span class="mode">02</span>
        <h2>NEON KART</h2>
        <p>Drift-Racer mit Items — und Bordkanone.</p>
        <span class="go">RACE</span>
      </a>
      <a class="card fight" href="fight/">
        <span class="mode">03</span>
        <h2>IRON FIST</h2>
        <p>Tekken-Style Duell. Combos, Specials, Best of 3.</p>
        <span class="go">FIGHT</span>
      </a>
    </div>
  </main>
