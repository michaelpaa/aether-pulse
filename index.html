<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <meta name="description" content="GAMINGZONE — vier Browser-Spiele. Pulse, Kart, Fight, Super Chicken 3D." />
  <title>GAMINGZONE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/hub.css" />
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div class="grid-floor"></div>
    <div class="beam beam-a"></div>
    <div class="beam beam-b"></div>
    <div class="noise"></div>
  </div>

  <header class="hero">
    <p class="mark">ENTER THE</p>
    <h1 class="brand" data-text="GAMINGZONE">GAMINGZONE</h1>
    <p class="tag">Vier Spiele. Ein Drop. Sofort spielen.</p>
  </header>

  <nav class="games" aria-label="Spiele">
    <a class="portal pulse" href="pulse/">
      <span class="num">01</span>
      <div class="portal-body">
        <h2>AETHER PULSE</h2>
        <p>Arena-Shooter · Combos · Pulse</p>
      </div>
      <span class="cta">PLAY</span>
      <span class="stripe" aria-hidden="true"></span>
    </a>
    <a class="portal kart" href="kart/">
      <span class="num">02</span>
      <div class="portal-body">
        <h2>NEON KART</h2>
        <p>Drift · Items · Bordkanone</p>
      </div>
      <span class="cta">RACE</span>
      <span class="stripe" aria-hidden="true"></span>
    </a>
    <a class="portal fight" href="fight/">
      <span class="num">03</span>
      <div class="portal-body">
        <h2>IRON FIST</h2>
        <p>Tekken-Style · Best of 3</p>
      </div>
      <span class="cta">FIGHT</span>
      <span class="stripe" aria-hidden="true"></span>
    </a>
    <a class="portal chicken" href="chicken/">
      <span class="num">04</span>
      <div class="portal-body">
        <h2>SUPER CHICKEN 3D</h2>
        <p>Race · Shoot · Boost</p>
      </div>
      <span class="cta">CLUCK</span>
      <span class="stripe" aria-hidden="true"></span>
    </a>
  </nav>

  <footer class="foot">
    <span>Mobile + Desktop</span>
    <span class="dot"></span>
    <span>No server load</span>
  </footer>
</body>
</html>
